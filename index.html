<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lights Out</title>
  <!-- inline favicon (a bulb) so the browser never requests a missing /favicon.ico (avoids a 404) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306111e'/%3E%3Ccircle cx='16' cy='14' r='7.5' fill='%23FFD23F'/%3E%3Crect x='12.5' y='20' width='7' height='5' rx='1.4' fill='%23FFD23F'/%3E%3C/svg%3E" />
  <!-- fonts trimmed to only those the UI renders: Exo 2 (body/labels) + Lilita One (tile numbers) -->
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The two images the stylesheet draws go through custom properties so the preloader can
       swap in their local blob: URL (see _CSS_ASSET_VARS). The literal paths here are the
       fallback if a fetch fails — without this the stylesheet re-requests them itself and
       "loaded == local" would not hold for the tile art. */
    :root {
      --bg-img:   url('assets/background.webp');
      --tile-img: url('assets/figma/tile.webp');
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
    }
    body {
      background: #06111e;
      touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Fixed design canvas: 1920 × 1080 (Figma native) ──
       Positioned top-left and centered via translate+scale in JS,
       so it fits any display size without flexbox-overflow miscentering. */
    #canvas {
      width: 1920px; height: 1080px;
      position: absolute;
      top: 0; left: 0;
      transform-origin: top left;
      background: #06111e var(--bg-img) center / cover no-repeat;
      overflow: hidden;
    }

    /* ── Animations ──────────────────────────────── */
    @keyframes fadeIn   { from { opacity:0; transform:translateY(6px); }  to { opacity:1; transform:translateY(0); } }
    @keyframes popIn    { from { opacity:0; transform:scale(0.45); }       to { opacity:1; transform:scale(1); } }
    @keyframes shake    { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
    @keyframes pulse    { 0%,100%{filter:brightness(1);}  50%{filter:brightness(1.28) drop-shadow(0 0 18px #4afa7c);} }

    /* ════════════════════════════════════════════
       QUESTION SCREEN — Figma layout (node 956:7170)
    ════════════════════════════════════════════ */

    /* Robot (top-left) */
    #qrobot {
      position: absolute;
      left: 55px; top: -16px;
      width: 196px; height: 257px;
      overflow: hidden;
      z-index: 5;
    }
    /* Byte dancing in the top-left (tutorial completion) */
    #byte-dance {
      position: absolute;
      left: 20px; top: -14px;
      width: 235px; height: auto;
      z-index: 6;
      display: none;
      transform-origin: center bottom;
      filter: drop-shadow(0 0 18px rgba(0,220,255,.45));
    }
    #byte-dance.show { display: block; }   /* the animated webp animates itself */
    /* while Byte is dancing, force the static robot fully out of paint so it can never
       show through / ghost behind the moving dance sprite (opacity !important beats the
       entrance animation's fill; visibility removes it from the layer entirely) */
    #qrobot.robot-hidden { opacity: 0 !important; visibility: hidden; }
    #qrobot img {
      position: absolute;
      left: -61.46%; top: -0.09%;
      width: 232.81%; height: 100.17%;
      max-width: none;
    }

    /* Bot text bar (the long top frame) */
    #bot-bar {
      position: absolute;
      left: 161px; top: 32px;
      width: 1499px; height: 150.654px;
      z-index: 4;
    }
    #bot-bar .frame {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #bot-text {
      position: absolute;
      left: 116px; right: 40px;
      top: 48%; transform: translateY(-50%);
      font-family: 'Exo 2', sans-serif;
      font-size: 34px; font-weight: 700;
      color: #dff4f8;
      text-shadow: 0 0 10px rgba(0,200,230,.5);
      white-space: nowrap;
      text-align: left;
    }

    /* Power button (top-right) */
    #power-btn {
      position: absolute;
      left: 1695px; top: 32px;
      width: 183px; height: 178px;
      object-fit: contain;
      z-index: 2;
    }
    #power-btn.pulsing { animation: pulse 1.2s ease-in-out infinite; }

    /* Glowing pipe connectors (behind panels) */
    .connector { position: absolute; z-index: 1; pointer-events: none; }
    .cclip { position: absolute; inset: 0; overflow: hidden; }
    .cclip img { position: absolute; max-width: none; transition: filter 0.25s ease; }

    /* flowing current — a green copy of the pipe, revealed as a sharp bright bolt of light
       that zips along the tube (a lightning pass, confined to the exact pipe shape) */
    .cclip .flow {
      position: absolute;
      max-width: none;
      opacity: 0;
      pointer-events: none;
      filter: brightness(2.7) saturate(2.1) hue-rotate(-88deg);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 36%, #000 47%, #000 53%, transparent 64%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, transparent 36%, #000 47%, #000 53%, transparent 64%, transparent 100%);
      -webkit-mask-size: 60% 100%; mask-size: 60% 100%;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }
    @keyframes currentFlow {
      from { -webkit-mask-position: -60% 0; mask-position: -60% 0; }
      to   { -webkit-mask-position: 165% 0; mask-position: 165% 0; }
    }
    #screen-question.current-on .connector:not(.cn-small) .flow {
      opacity: 1;
      animation: currentFlow 1.15s linear 0.4s infinite both;   /* slower so the surge is clearly noticeable */
    }
    #screen-question.current-on .cclip img:not(.flow) { filter: brightness(1.15); }

    /* Main panel */
    #main-panel {
      position: absolute;
      left: 72px; top: 215px;
      width: 1573.948px; height: 453px;
      z-index: 3;
    }

    /* Entrance: the box appears as a bright line, then opens vertically */
    #main-panel.opening {
      animation: panelOpen 1.9s cubic-bezier(0.22, 1.04, 0.36, 1) 1.0s both;
    }
    @keyframes panelOpen {
      0%   { opacity: 0; transform: scale(0.42, 0.02);
             filter: brightness(2.3) drop-shadow(0 0 46px rgba(15,229,250,1)); }
      16%  { opacity: 1; transform: scale(1, 0.025);
             filter: brightness(2.3) drop-shadow(0 0 46px rgba(15,229,250,1)); }
      55%  { transform: scale(1, 1.05);
             filter: brightness(1.35) drop-shadow(0 0 26px rgba(15,229,250,.6)); }
      75%  { transform: scale(1, 0.985); }
      100% { opacity: 1; transform: scale(1, 1); filter: none; }
    }

    /* ── Playful one-by-one entrance for the question screen ── */
    @keyframes robotBounceIn {
      0%   { opacity: 0; transform: translateY(-52px) scale(0.4); }
      55%  { opacity: 1; transform: translateY(8px)  scale(1.12); }
      78%  {             transform: translateY(-4px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0)    scale(1); }
    }
    @keyframes barExpandIn {
      0%   { opacity: 0; transform: scaleX(0.12); }
      60%  { opacity: 1; transform: scaleX(1.04); }
      100% { opacity: 1; transform: scaleX(1); }
    }
    @keyframes popBounceIn {
      0%   { opacity: 0; transform: scale(0.3)  translateY(16px); }
      55%  { opacity: 1; transform: scale(1.15) translateY(-6px); }
      78%  {             transform: scale(0.95) translateY(2px); }
      100% { opacity: 1; transform: scale(1)    translateY(0); }
    }
    @keyframes connDrawIn {
      0%   { opacity: 0; transform: scale(0.55); }
      70%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes switchDrop {
      0%   { opacity: 0; transform: translateY(-46px) scale(0.7); }
      60%  { opacity: 1; transform: translateY(6px)   scale(1.06); }
      80%  {             transform: translateY(-2px)  scale(0.98); }
      100% { opacity: 1; transform: translateY(0)     scale(1); }
    }

    #screen-question.intro #qrobot    { animation: robotBounceIn 0.85s cubic-bezier(0.34,1.56,0.64,1) 0.15s both; transform-origin: center bottom; }
    /* bot bar appears LAST (after switches + options + vent), then types its text */
    #bot-bar.bar-hidden { opacity: 0; pointer-events: none; }
    #bot-bar.bar-reveal { animation: barExpandIn 0.6s cubic-bezier(0.34,1.4,0.64,1) both; transform-origin: left center; }
    /* blue pipe + red power button appear together, AFTER the box has fully opened (~2.9s) */
    #screen-question.intro #power-btn { animation: popBounceIn 0.78s cubic-bezier(0.34,1.56,0.64,1) 2.95s both; }
    #screen-question.intro .connector:not(.opt-pipe) { animation: connDrawIn 0.65s cubic-bezier(0.34,1.4,0.64,1) 2.95s both; }
    #panel-frame {
      position: absolute;
      left: -0.79%; top: 0;
      width: 101.58%; height: 102.76%;
      pointer-events: none;
    }
    /* Vent indicator bars — sit on top of the panel housing */
    .vent-bars { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .vent-bar {
      position: absolute;
      border-radius: 4px;
      background: #0ce4f9;
      box-shadow: 0 0 3px rgba(12,228,249,.4), inset 0 0 3px rgba(255,255,255,.22);
      transition: background .18s ease, box-shadow .18s ease;
    }
    #main-panel.vent-correct .vent-bar {
      background: #2bff7a;
      box-shadow: 0 0 13px rgba(43,255,122,.95), inset 0 0 4px rgba(255,255,255,.4);
    }

    /* pattern complete: a bright green pulse flows through the vent bars (left → right, toward the pipe) */
    @keyframes ventFlow {
      from { background-position: -130% 0; }
      to   { background-position: 230% 0; }
    }
    #screen-question.current-on .vent-bar {
      background: linear-gradient(90deg, #1aa84a 0%, #5dff95 42%, #eaffef 50%, #5dff95 58%, #1aa84a 100%);
      background-size: 260% 100%;
      box-shadow: 0 0 13px rgba(60,255,140,.9), inset 0 0 4px rgba(255,255,255,.45);
      animation: ventFlow 1.0s linear infinite;
    }
    #screen-question.current-on .vent-bar:nth-child(1) { animation-delay: 0s; }
    #screen-question.current-on .vent-bar:nth-child(2) { animation-delay: 0.12s; }
    #screen-question.current-on .vent-bar:nth-child(3) { animation-delay: 0.24s; }

    /* Switch row */
    #switch-row {
      position: absolute;
      left: 0; right: 0;
      top: 156px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 23px;
      z-index: 2;
    }

    /* ── Switch tile (slot) ── */
    .sw {
      width: 128px; height: 174px;
      flex-shrink: 0;
      border-radius: 11px;
    }
    .tile {
      position: relative;
      width: 100%; height: 100%;
      background-image: var(--tile-img);
      background-repeat: no-repeat;
      background-size: 248.81% 138.26%;
      background-position: 49.6% 57.92%;
      border-radius: 8px;
    }
    .tile-num {
      position: absolute;
      left: 50%; top: 45%;
      transform: translate(-50%, -50%);
      font-family: 'Lilita One', cursive;
      font-weight: 400;
      font-size: 80px;
      line-height: 1;
      color: #000;
    }

    @keyframes correctGlow {
      0%   { box-shadow: 0 0  0px  0px rgba(255,255,255,0); }
      25%  { box-shadow: 0 0 22px 10px rgba(255,255,255,.95), 0 0 50px 20px rgba(255,255,255,.4); }
      100% { box-shadow: 0 0  0px  0px rgba(255,255,255,0); }
    }

    .sw.filled .tile  { animation: fadeIn 0.3s ease both; }
    .sw.new           { animation: correctGlow 0.95s ease-out both; }
    .sw.new    .tile  { animation: popIn  0.55s ease both; }

    /* "read the pattern" highlight — each prefilled switch pops + glows as its number is read */
    @keyframes readPop {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(0,229,255,0)); }
      40%  { transform: scale(1.16); filter: drop-shadow(0 0 16px rgba(0,229,255,.95)); }
      100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(0,229,255,0)); }
    }
    .sw.read-pop { animation: readPop 0.62s ease-out; position: relative; z-index: 4; }

    /* Empty slots — cyan neon border (Figma #a3fffc) */
    .sw.empty {
      background: transparent;
      border: 4px solid #a3fffc;
      border-radius: 11px;
    }
    /* active "place here" slot — same plain cyan border as the other empty slots (no glow) */
    .sw.empty.next-slot {
      border: 4px solid #a3fffc;
    }

    @keyframes wrongGlowPulse {
      0%   { box-shadow: 0 0 0 0 rgba(255,171,46,0);           outline-color: rgba(255,190,90,.35); }
      16%  { box-shadow: 0 0 34px 12px rgba(255,171,46,.98), 0 0 68px 26px rgba(255,140,20,.55); outline-color: #ffbf5a; }
      100% { box-shadow: 0 0 18px 4px rgba(255,171,46,.7);    outline-color: #ffab2e; }
    }
    .sw.wrong-option { animation: shake 0.45s ease; }
    .sw.wrong-option .tile {
      outline: 3px solid #ffab2e;
      border-radius: 8px;
      animation: wrongGlowPulse 0.8s ease-out both;
    }

    /* sparks flung from a wrong switch */
    .spark {
      position: absolute;
      left: 50%; top: 45%;
      width: 6px; height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 10px 3px rgba(255,150,40,.95);
    }
    .spark-burst {
      position: absolute;
      left: 50%; top: 45%;
      width: 110px; height: 110px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 39;
      background: radial-gradient(circle, rgba(255,210,90,.95) 0%, rgba(255,120,30,.55) 38%, rgba(255,60,30,0) 70%);
    }

    /* Options box (bottom) */
    #options-box {
      position: absolute;
      left: 488.38px; top: 728px;
      width: 742.047px; height: 256px;
      z-index: 3;
    }
    #options-box .frame {
      position: absolute;
      left: -0.79%; top: 0;
      width: 101.58%; height: 102.3%;
      pointer-events: none;
    }
    #options-area {
      position: absolute;
      left: 0; right: 0;
      top: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      z-index: 2;
    }

    @keyframes optTilePop {
      0%   { opacity: 0; transform: translateY(24px) scale(0.55); }
      60%  { opacity: 1; transform: translateY(-5px) scale(1.12); }
      80%  {             transform: translateY(2px)  scale(0.96); }
      100% { opacity: 1; transform: translateY(0)    scale(1); }
    }
    #options-area.hidden-initially {
      opacity: 0;
      pointer-events: none;
    }
    /* all 4 option switches pop in together AFTER the box has deployed */
    #options-area.reveal .sw {
      animation: optTilePop 0.95s cubic-bezier(0.34,1.5,0.5,1) both;
    }

    /* Inactivity nudge — the options bounce (in a wave) to draw an idle player back.
       One cycle = a double-hop (~0.8s) then a rest (~0.6s); repeated 4× so the nudge
       plays for ~5.6s each time it triggers. */
    @keyframes idleBounce {
      0%   { transform: translateY(0); }
      22%  { transform: translateY(-18px); }
      35%  { transform: translateY(0); }
      46%  { transform: translateY(-8px); }
      57%  { transform: translateY(0); }
      100% { transform: translateY(0); }
    }
    #options-area.idle-nudge .sw { animation: idleBounce 1.4s cubic-bezier(0.3,1,0.5,1) 4; }
    #options-area.idle-nudge .sw:nth-child(1) { animation-delay: 0s; }
    #options-area.idle-nudge .sw:nth-child(2) { animation-delay: 0.07s; }
    #options-area.idle-nudge .sw:nth-child(3) { animation-delay: 0.14s; }
    #options-area.idle-nudge .sw:nth-child(4) { animation-delay: 0.21s; }

    /* ── Deploy: options box emerges from the main panel ── */
    /* 1. the two link pipes shoot down out of the panel bottom */
    .opt-pipe { transform-origin: top center; }
    .opt-pipe.hidden-initially { opacity: 0; transform: scaleY(0); }
    .opt-pipe.extend { animation: pipeExtend 0.95s cubic-bezier(0.3, 1, 0.4, 1) both; }
    @keyframes pipeExtend {
      0%   { opacity: 0.25; transform: scaleY(0); }
      70%  { opacity: 1;    transform: scaleY(1.06); }
      100% { opacity: 1;    transform: scaleY(1); }
    }

    /* 2. the box unfolds downward out of the panel, riding the pipes */
    #options-box { transform-origin: top center; }
    #options-box.hidden-initially { opacity: 0; pointer-events: none; }
    #options-box.deploy {
      animation: optionsBoxDeploy 1.4s cubic-bezier(0.22, 1.15, 0.36, 1) both;
    }
    @keyframes optionsBoxDeploy {
      0%   { opacity: 0; transform: translateY(-70px) scaleY(0.5);
             filter: brightness(1.7) drop-shadow(0 0 30px rgba(15,229,250,.95)); }
      55%  { opacity: 1; transform: translateY(14px) scaleY(1.06);
             filter: brightness(1.25) drop-shadow(0 0 18px rgba(15,229,250,.6)); }
      78%  { transform: translateY(-5px) scaleY(0.99); }
      100% { opacity: 1; transform: translateY(0) scaleY(1); filter: none; }
    }
    /* on completion the option placeholder retracts back up into the panel/vent
       (pointer-events off — it animates to opacity 0 but stays hit-testable otherwise) */
    #options-box.retract { animation: optionsBoxRetract 0.55s cubic-bezier(0.5, 0, 0.75, 0.4) forwards; pointer-events: none; }
    @keyframes optionsBoxRetract {
      0%   { opacity: 1; transform: translateY(0) scaleY(1); }
      100% { opacity: 0; transform: translateY(-80px) scaleY(0.32); }
    }
    .opt-pipe.retract { animation: pipeRetract 0.5s ease forwards; }
    @keyframes pipeRetract {
      from { opacity: 1; transform: scaleY(1); }
      to   { opacity: 0; transform: scaleY(0); }
    }

    /* Option tiles — slightly smaller than the row tiles */
    #options-area .sw { width: 112.208px; height: 152.533px; }
    #options-area .tile-num { font-size: 70px; }

    .sw.option {
      cursor: pointer;
      transition: transform 0.13s;
    }
    .sw.option:hover { transform: scale(1.08); }

    /* ── Hint button (yellow bulb, right end of the bot bar) — art from assets/hint-yellow.svg ── */
    #hint-btn {
      position: absolute;
      left: 1541px; top: 62px;
      width: 84px; height: 84px;
      border-radius: 50%;
      background: none; border: none; padding: 0;
      cursor: pointer;
      z-index: 6;
      opacity: .62;
      pointer-events: none;   /* inert until armed after 2 wrong taps */
      transition: opacity .45s ease, transform .12s ease;
    }
    /* idle: plain bulb — NO pulse, NO glow (stays quiet until the player needs a hint) */
    #hint-btn img { display: block; width: 100%; height: 100%; }
    /* armed after 2 wrong taps: bright, pulsing + glowing to grab focus */
    #hint-btn.armed { opacity: 1; pointer-events: auto; }
    #hint-btn.armed img { animation: hintArmed 0.8s ease-in-out infinite; }
    @keyframes hintArmed {
      0%,100% { transform: scale(1);    filter: drop-shadow(0 0 12px rgba(255,210,63,.9)); }
      50%     { transform: scale(1.18); filter: drop-shadow(0 0 34px rgba(255,210,63,1)) brightness(1.15); }
    }
    #hint-btn.used { opacity: .4; pointer-events: none; }
    #hint-btn.used img { animation: none; filter: none; }
    /* stays hidden through the entrance cascade; JS reveals it the moment the bot bar appears */
    #hint-btn.hb-hidden { opacity: 0; pointer-events: none; }
    /* pop-in when it appears with the bar (transform only, so opacity/armed states are untouched) */
    @keyframes hbPopIn {
      0%   { transform: scale(0.3)  translateY(10px); }
      55%  { transform: scale(1.15) translateY(-4px); }
      78%  { transform: scale(0.95) translateY(1px); }
      100% { transform: scale(1)    translateY(0); }
    }
    #hint-btn.hb-reveal { animation: hbPopIn 0.7s cubic-bezier(0.34,1.56,0.64,1); }

    /* ── Hint overlay: "+N" hop arrows above the switches (assets have +N baked in) ── */
    #hint-arrows {
      position: absolute; inset: 0;
      z-index: 4; pointer-events: none;
    }
    #hint-arrows.hidden { display: none; }
    .hint-arrow { position: absolute; opacity: 0; }   /* hidden until revealed with .show */
    .hint-arrow img {
      display: block; width: 100%; height: auto;
      filter: drop-shadow(0 0 7px rgba(12,228,249,.85));
    }
    .hint-arrow.show { opacity: 1; }
    .hint-arrow.show img { animation: hintArrowIn .5s cubic-bezier(0.34,1.56,0.64,1) both; }
    /* glow pulse — added when the bot says "we keep adding the same number" */
    .hint-arrow.glow img { animation: hintArrowGlow 1.1s ease-in-out infinite; }
    @keyframes hintArrowIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.85); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes hintArrowGlow {
      0%,100% { filter: drop-shadow(0 0 7px rgba(12,228,249,.85)); }
      50%     { filter: drop-shadow(0 0 20px rgba(12,228,249,1)) brightness(1.25); }
    }



    /* ════════════════════════════════════════════
       INTRO / COMPLETE SCREENS
    ════════════════════════════════════════════ */
    #screen-intro {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 80px;
      animation: fadeIn 0.5s ease;
    }

    #title-screen-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* ── Title-screen PLAY button (image asset, bottom-right corner) ── */
    #screen-intro .btn-play {
      position: absolute;
      right: 66px; bottom: 74px;
      z-index: 2;
    }
    .btn-play {
      background: none; border: none; padding: 0; margin: 0; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      width: 340px; line-height: 0;
      will-change: transform;
    }
    .btn-play img {
      width: 340px; height: auto; display: block;
      will-change: transform, filter;
      /* fallback shaped glow + depth (GSAP animates this when loaded) */
      filter: drop-shadow(0 0 16px rgba(12,228,249,0.5)) drop-shadow(0 7px 14px rgba(0,16,32,0.55));
    }


    /* ── Boot: start button hidden until 100% of assets are local, then pops in ── */
    .btn-play.boot-hidden { opacity: 0 !important; pointer-events: none !important; transform: scale(0.4); }
    .btn-play.btn-pop { animation: btnPopIn 0.62s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes btnPopIn {
      0%   { opacity: 0; transform: scale(0.4)  translateY(14px); }
      60%  { opacity: 1; transform: scale(1.12) translateY(-4px); }
      100% { opacity: 1; transform: scale(1)    translateY(0); }
    }
    /* Themed loading bar shown in the PLAY button's place while assets download */
    #boot-bar-wrap {
      position: absolute; right: 66px; bottom: 92px;
      width: 340px; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      transition: opacity 0.4s ease;
    }
    #boot-bar-wrap.boot-gone { opacity: 0; pointer-events: none; }
    #boot-bar {
      width: 100%; height: 14px;
      background: rgba(0,229,255,0.14);

    .hidden { display: none !important; }

    /* ── Rotate-to-landscape hint (narrow portrait phones only) ── */
    #rotate-hint {
      display: none;

    /* ════════════════════════════════════════════
       CONFETTI — themed energy burst on pattern complete
    ════════════════════════════════════════════ */
    #fx-confetti {

    #screen-complete {

<!-- GSAP (for the play-button attention effects) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  /* ── Media formats ───────────────────────────────────────────────────────────────────
     All media uses efficient, widely-supported open formats:
       • video  → WebM (VP9 video + Opus audio, yuv420p)   assets/end-video.webm
       • audio  → Ogg/Opus (64k voice, 96k SFX)            audio/*.ogg
       • images → WebP (q≈80–85), vectors stay SVG          assets/*.webp, *.svg
     Browser support: WebM/VP9 + Ogg/Opus play in Chrome, Edge, Firefox, and recent Safari
     (Safari 14.1+ / macOS 11+ / iOS 14.1+ for Opus & VP9). Older Safari is the only gap. */

  /* ── Asset resolver (filled in by the preloader below) ───────────────────────────────
     `_assetBlob[path]` holds a local blob: URL once the file is fetched (or the original
     path as a fallback). `assetURL()` is used for every dynamic src so "loaded == local". */
  const _assetBlob = {};
  function assetURL(p) { return _assetBlob[p] || p; }

  /* Audio elements are created WITHOUT a src and with preload="none" so the browser never
     double-downloads them — the preloader fetches each once and assigns its blob: URL. */
  const AUDIO_REG = [];
  function mkAudio(url) { const a = new Audio(); a.preload = 'none'; AUDIO_REG.push({ url: url, el: a }); return a; }

  /* ── Voice-over lines ─────────────────────────────────
     One recorded clip per dialogue line. The file name is the line text with any trailing
     "." dropped, + ".ogg" (e.g. "We keep adding the same number!.ogg"). `queueBotText`
     auto-plays the matching clip, so every narration/prompt/win line is spoken. */
  const VOICE_LINES = [
    'Let us start fixing the switches.',
    'These switches are in a pattern.',
    'Let us read the pattern together.',
    'We are adding 2 at each step.',
    'We keep adding the same number!',
    'Tap the correct switch to continue the pattern.',
    'Tap the correct switch.',
    'Follow the pattern!',
    'Good job! You fixed these switches.',
    'Wuhoo! The switches are fixed.',
    'Well done! All the switches are fixed.'
  ];
  const VOICE = {};
  VOICE_LINES.forEach(t => { VOICE[t] = mkAudio('audio/' + t.replace(/\.$/, '') + '.ogg'); });

  /* ── Current-flow SFX (real recordings) — a sharp zap + a sustained energy surge that
     play when the completed pattern powers the circuit ── */
  const sndElectricity  = mkAudio('audio/electricity.ogg'); sndElectricity.volume = 0.9;
  const sndEnergy       = mkAudio('audio/energy.ogg');       sndEnergy.volume      = 0.75;

  /* ── Spoken-number clips (all the numbers we have audio/<n>.ogg files for) ── */
  /* Only the numbers the game actually speaks: the L1 pattern read aloud (2,4,6,8,10) plus
     every value the player places across the 4 levels (12,14,16 / 18,21,24 / 25,30,35 / 11,13,15). */
  const NUMBER_VOICE_FILES = [2, 4, 6, 8, 10, 11, 12, 13, 14, 15, 16, 18, 21, 24, 25, 30, 35];
  const NUMBER_VOICES = {};
  NUMBER_VOICE_FILES.forEach(n => { NUMBER_VOICES[n] = mkAudio('audio/' + n + '.ogg'); });

  /* ── Speech channel ───────────────────────────────────────────────────────────────────
     Only ONE spoken clip may ever sound at a time. Two kinds of speech exist:

       • queue-driven — dialogue lines and `queueNumberVoice`, which the dialogue queue is
         waiting on. These OWN the channel until they end; cutting one would strand
         `_advanceQueue` on its watchdog, so a barge-in must never touch them.
       • free — a number spoken on a tap, or the level prompt. The newest one wins: it cuts
         whatever free clip is still sounding.

     Without this, tapping fast made 2–3 number clips (and the level prompt) play at once. */
  const ALL_SPEECH = Object.values(VOICE).concat(Object.values(NUMBER_VOICES));
  let _queueClip = null;   /* clip the dialogue queue is waiting on — never barge in on it */
  let _freeClip  = null;   /* clip speaking outside the queue — the newest one wins */

  /* cut whatever is speaking outside the dialogue queue */
  function _stopFreeSpeech() {
    const c = _freeClip;
    _freeClip = null;
    if (c && c !== _queueClip) { try { c.pause(); c.currentTime = 0; } catch (e) {} }
  }

  /* hard stop — every clip, queue-owned or not (level change / reset) */
  function _stopAllSpeech() {
    _queueClip = null; _freeClip = null;
    ALL_SPEECH.forEach(a => { try { a.pause(); a.currentTime = 0; } catch (e) {} });
  }

  /* speak a clip outside the dialogue queue, cutting any other free speech first */
  function speakNow(snd) {
    if (!snd) return;
    _stopFreeSpeech();
    _freeClip = snd;
    const clear = () => { if (_freeClip === snd) _freeClip = null; };
    snd.onended = clear; snd.onerror = clear;
    try { snd.pause(); snd.currentTime = 0; } catch (e) {}
    snd.play().catch(clear);
  }

  /* speak a number when the player places it (silently skips numbers with no clip) */
  function playNumberVoice(n) { speakNow(NUMBER_VOICES[n]); }

  /* Same clip, but run through the dialogue queue so the line that follows (e.g. the win
     line on the row-completing tap) waits for it instead of talking over it. Advances on
     `ended`, on error/play-reject, or on a watchdog — never wedges the queue. */
  function queueNumberVoice(n) {
    const snd = NUMBER_VOICES[n];
    if (!snd) return;
    queueAction(done => {
      let stepped = false, wd = null;
      const step = () => {
        if (stepped) return; stepped = true;
        clearTimeout(wd);
        if (_queueClip === snd) _queueClip = null;
        snd.onended = snd.onerror = snd.onloadedmetadata = null;
        setTimeout(done, 180);
      };
      const armWd = () => {
        clearTimeout(wd);
        const d = (isFinite(snd.duration) && snd.duration > 0) ? snd.duration * 1000 : 1200;
        wd = setTimeout(step, d + 1200);
      };
      snd.onended = step; snd.onerror = step; snd.onloadedmetadata = armWd;
      armWd();
      _stopFreeSpeech();
      _queueClip = snd;
      try { snd.pause(); snd.currentTime = 0; } catch (e) {}
      snd.play().catch(step);
    });
  }

  /* Tutorial "read the pattern together": highlight each prefilled switch in turn and
     speak its number, left to right. Calls done() when finished. */
  function readPattern(cfg, done) {
    const tiles = document.querySelectorAll('#switch-row .sw.filled');
    const pre = cfg.prefilled.slice().sort((a, b) => a - b);   /* slot indices, in DOM order */
    let i = 0;
    function next() {
      if (i >= tiles.length) { setTimeout(done, 350); return; }
      const t = tiles[i];
      const val = cfg.seq[pre[i]];
      const snd = NUMBER_VOICES[val];
      if (t) { t.classList.remove('read-pop'); void t.offsetWidth; t.classList.add('read-pop'); }
      i++;
      if (snd) {
        /* advance on `ended`, on play-reject, OR a watchdog — never hang the tutorial */
        let stepped = false, wd = null;
        const step = (gap) => {
          if (stepped) return; stepped = true;
          clearTimeout(wd);
          if (_queueClip === snd) _queueClip = null;
          snd.onended = null;
          setTimeout(next, gap);
        };
        wd = setTimeout(() => step(180), ((isFinite(snd.duration) && snd.duration > 0) ? snd.duration * 1000 : 1200) + 1500);
        snd.onended = () => step(180);
        _queueClip = snd;          /* queue-owned — a barge-in must not cut the read-aloud */
        snd.currentTime = 0;
        snd.play().catch(() => step(650));
      } else {
        setTimeout(next, 650);   /* no clip for this number → just hold on the highlight */
      }
    }
    next();
  }

  let _voicePlaying = false;
  const _voiceQueue = [];

  function _setOptionsLock(locked) {
    const el = document.getElementById('options-area');
    if (el) el.style.pointerEvents = locked ? 'none' : '';
  }

  /* typewriter the dialogue out, blipping softly as the character "speaks" */
  const TYPE_MS = 90;   /* ms per character — slower, easier-to-read typing pace */
  let _typeTimer = null;
  function _typeBotText(text, onTyped) {
    const el = document.getElementById('bot-text');
    if (!el) { if (onTyped) onTyped(); return; }
    el.textContent = '';
    if (_typeTimer) { clearInterval(_typeTimer); _typeTimer = null; }
    let i = 0;
    _typeTimer = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      const ch = text[i - 1];
      if (i % 2 === 0 && ch && ch !== ' ') sfxTalk();
      if (i >= text.length) { clearInterval(_typeTimer); _typeTimer = null; if (onTyped) onTyped(); }
    }, TYPE_MS);
  }

  function _advanceQueue() {
    if (_voiceQueue.length === 0) {
      _voicePlaying = false;
      _setOptionsLock(false);
      return;
    }
    const item = _voiceQueue.shift();
    _voicePlaying = true;
    _setOptionsLock(true);
    let advanced = false, wd = null, typed = false, audioDone = false;
    const finish = () => {
      if (advanced) return; advanced = true;
      clearTimeout(wd);
      if (_queueClip === item.audio) _queueClip = null;
      if (item.onDone) item.onDone();
      _advanceQueue();
    };
    /* advance only once BOTH the line has fully typed AND the voice clip has ended, so a
       slower typewriter never gets cut off by a shorter clip */
    const maybeFinish = () => { if (typed && audioDone) finish(); };
    if (item.action) {
      /* custom step (e.g. read the pattern aloud) — no bot text; calls finish when done */
      item.action(finish);
      return;
    }
    _typeBotText(item.text, () => { typed = true; maybeFinish(); });
    if (item.audio) {
      /* Advance on any of three paths so the (options-locked) narration can never wedge:
         (1) the `ended` event, (2) an `error`/play-reject handler, (3) a watchdog re-armed
         to the real clip length once metadata loads (the watchdog force-advances). */
      item.audio.currentTime = 0;
      item.audio.onended = () => { audioDone = true; maybeFinish(); };
      item.audio.onerror = () => { audioDone = true; maybeFinish(); };
      const armWd = () => {
        clearTimeout(wd);
        const d = (isFinite(item.audio.duration) && item.audio.duration > 0)
                  ? item.audio.duration * 1000 : (item.text.length * TYPE_MS + 1300);
        wd = setTimeout(finish, d + Math.max(2500, item.text.length * TYPE_MS));
      };
      item.audio.onloadedmetadata = armWd;
      armWd();
      _stopFreeSpeech();          /* a stray number clip must not run under the narration */
      _queueClip = item.audio;    /* queue-owned until `finish` */
      item.audio.play().catch(() => { audioDone = true; maybeFinish(); });
    } else {
      /* narration line with no audio → hold long enough to read, advance once typed */
      const hold = item.text.length * TYPE_MS + 1300;
      setTimeout(() => { audioDone = true; maybeFinish(); }, hold);
      wd = setTimeout(finish, hold + 3000);
    }
  }

  function queueBotText(text, audio, onDone) {
    /* auto-play the matching voice-over clip unless an explicit one is passed */
    _voiceQueue.push({ text, audio: audio || VOICE[text] || null, onDone });
    if (!_voicePlaying) _advanceQueue();
  }

  /* queue a custom step that runs in sequence with the dialogue (options stay locked) */
  function queueAction(action) {
    _voiceQueue.push({ action });
    if (!_voicePlaying) _advanceQueue();
  }

  function clearVoiceQueue() {
    _voiceQueue.length = 0;
    _voicePlaying = false;
    _setOptionsLock(false);
    if (_typeTimer) { clearInterval(_typeTimer); _typeTimer = null; }
    _stopAllSpeech();
  }

  /* ── SFX (Web Audio API — no external files) ─────── */
  let _ctx = null;
  function ac() {
    if (!_ctx) _ctx = new (window.AudioContext || window.webkitAudioContext)();
    return _ctx;
  }

  /* master output — boosts overall SFX loudness, compressor tames peaks so it stays clean */
  let _master = null;
  function masterGain() {
    if (!_master) {
      const ctx = ac();
      _master = ctx.createGain();
      _master.gain.value = 1.9;
