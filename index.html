  /* current surge — the recorded zap + energy-surge SFX that play as the completed pattern
     powers the circuit (current flows through the vent + pipes). The energy clip is long
     (~12s), so `stopCurrentFlow` cuts it when the level transitions out. */
  function sfxCurrentFlow() {
    [sndElectricity, sndEnergy].forEach(s => {
      try { s.pause(); s.currentTime = 0; } catch (e) {}
      s.play().catch(() => {});
    });
  }
  function stopCurrentFlow() {
    [sndElectricity, sndEnergy].forEach(s => { try { s.pause(); s.currentTime = 0; } catch (e) {} });
  }

  /* ── Scale canvas to fit any viewport (letterboxed, aspect-preserved) ── */
  function scaleCanvas() {
    const el = document.getElementById('canvas');
    if (!el) return;
    const vp = window.visualViewport;
    const vw = (vp && vp.width)  || window.innerWidth  || document.documentElement.clientWidth;
    const vh = (vp && vp.height) || window.innerHeight || document.documentElement.clientHeight;
    const s  = Math.min(vw / 1920, vh / 1080);
    /* centre the scaled canvas with an explicit translate (letterbox offsets) */
    const tx = Math.round((vw - 1920 * s) / 2);
    const ty = Math.round((vh - 1080 * s) / 2);
    el.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }
  let _scaleRAF = null;
  function requestScale() {
    if (_scaleRAF) cancelAnimationFrame(_scaleRAF);
    _scaleRAF = requestAnimationFrame(scaleCanvas);
  }
  window.addEventListener('resize', requestScale);
  window.addEventListener('orientationchange', requestScale);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', requestScale);
  scaleCanvas();
  /* a couple of follow-up passes catch mobile address-bar / late layout shifts */
  window.addEventListener('load', scaleCanvas);
  setTimeout(scaleCanvas, 300);

  /* ── Game config ───────────────────────────────── */
  /* Each level is an 8-slot skip-counting sequence. `prefilled` lists the slot indices
     shown from the start (5 of them); the player fills the remaining 3 (in order) by
     tapping the correct option. `options` are the 4 tiles shown below (one distractor —
     the "next" number beyond the sequence). Every fill value has an audio/<n>.ogg clip. */
  const ROWS_CONFIG = [
    { seq: [2, 4, 6, 8, 10, 12, 14, 16],   prefilled: [0, 1, 2, 3, 4], options: [16, 12, 18, 14], label: 'Level 1' },
    { seq: [3, 6, 9, 12, 15, 18, 21, 24],  prefilled: [0, 1, 2, 3, 4], options: [24, 18, 27, 21], label: 'Level 2' },
    { seq: [5, 10, 15, 20, 25, 30, 35, 40], prefilled: [0, 1, 2, 3, 7], options: [35, 25, 45, 30], label: 'Level 3' },
    { seq: [1, 3, 5, 7, 9, 11, 13, 15],    prefilled: [0, 1, 2, 3, 4], options: [15, 11, 17, 13], label: 'Level 4' },
  ];
  const TOTAL = 8;
  const SWITCH_OFFSET_MS = 3850;   /* wait for the box to open + the pipe & power to appear */
  const SWITCH_STEP_MS   = 340;    /* gap between each switch dropping in */

  function getUserPositions(cfg) {
    const pre = new Set(cfg.prefilled);
    const pos = [];
    for (let i = 0; i < cfg.seq.length; i++) if (!pre.has(i)) pos.push(i);
    return pos;
  }

  /* ── State ─────────────────────────────────────── */
  let phase       = 'intro';
  let currentRow  = 0;
  let grid        = [];
  let wrongCount  = 0;
  let wrongAnswer = null;
  let showHint    = false;
  let justPlaced  = false;
  let firstRender = false;
  let timer       = null;

  function initGrid() {
    /* the player fills the non-prefilled slots in order, so each row starts empty */
    grid = ROWS_CONFIG.map(() => []);
  }

  function getCorrect(cfg, filledCount) {
    const pos = getUserPositions(cfg);
    return cfg.seq[pos[filledCount]];
  }

  /* ── Hint feature ──────────────────────────────────
     After 2 wrong taps the bulb button glows ("armed"). Tapping it reveals the pattern
     hint: "+N" hop arrows above the switches + the correct option glowing. The arrow art
     already has the step baked in (arrow arc = +2, arrow arc 3 = +3, arrow arc 2 = +5). */
  const SW_TILE = 128, SW_GAP = 23, SW_PITCH = SW_TILE + SW_GAP, PANEL_W = 1573.948;
  const HINT_ARROW_SRC = { 2: 'assets/arrow arc.webp', 3: 'assets/arrow arc 3.webp', 5: 'assets/arrow arc 2.webp' };
  let hintArmed = false;
  let tutorialArrowsLocked = false;   /* keep the +2 arrows on screen through the Level-1 tutorial */

  /* panel-relative x-centre of switch i, matching the centred flex row in CSS */
  function switchCenterX(i, count) {
    const rowW = count * SW_TILE + (count - 1) * SW_GAP;
    return (PANEL_W - rowW) / 2 + i * SW_PITCH + SW_TILE / 2;
  }

  /* build the "+N" hop arrows (one per gap) — all start hidden; reveal with the helpers below */
  function buildHintArrows(cfg) {
    const wrap = document.getElementById('hint-arrows');
    wrap.innerHTML = '';
    const count = cfg.seq.length;
    const step  = cfg.seq[1] - cfg.seq[0];
    const src   = assetURL(HINT_ARROW_SRC[step] || HINT_ARROW_SRC[2]);
    const AW    = 120;   /* scaled to fit the band above the switches (~82px tall) */
    for (let i = 0; i < count - 1; i++) {          /* one arrow per gap between switches */
      const mid = switchCenterX(i, count) + SW_PITCH / 2;
      const a = document.createElement('div');
      a.className = 'hint-arrow';
      a.style.left  = (mid - AW / 2) + 'px';
      a.style.top   = '72px';   /* below the vent housing, arrowheads just above the switches */
      a.style.width = AW + 'px';
      const img = document.createElement('img');
      img.src = src; img.alt = '+' + step;
      a.appendChild(img);
      wrap.appendChild(a);
    }
  }
  function _arrows() { return document.querySelectorAll('#hint-arrows .hint-arrow'); }

  /* reveal every arrow at once (staggered) — used by the bulb hint */
  function showAllArrows() {
    _arrows().forEach((a, i) => setTimeout(() => a.classList.add('show'), i * 70));
  }
  /* reveal arrows [from..to] one by one; calls done() when finished — used by the tutorial */
  function revealArrowsSeq(from, to, stepMs, done) {
    const arrows = _arrows();
    let i = from;
    (function next() {
      if (i > to) { if (done) setTimeout(done, 300); return; }
      if (arrows[i]) { arrows[i].classList.add('show'); sfxPop(560 + (i - from) * 45); }
      i++;
      setTimeout(next, stepMs);
    })();
  }
  /* make arrows [from..to] pulse together */
  function glowArrows(from, to) {
    const arrows = _arrows();
    for (let i = from; i <= to && i < arrows.length; i++) if (arrows[i]) arrows[i].classList.add('glow');
  }
  /* Level-1 tutorial: glow the "+2" hop ARC that points INTO the current blank slot — the
     "answer goes here" guide (an arrow arc, not a plain arrow). It clears every other arc's
     glow first so only this one pulses (single guide). The arc into the FIRST blank is already
     revealed in the opening one-by-one sequence, so at the tap prompt this only switches its
     glow on (no pop). After each correct pick it advances the glow (and reveals, if needed) the
     arc into the next blank slot. */
  function showBlankArc() {
    if (currentRow !== 0 || !tutorialArrowsLocked) return;
    const arrows = _arrows();
    arrows.forEach(a => a.classList.remove('glow'));   /* only the blank arc glows (single pulse) */
    const up = getUserPositions(ROWS_CONFIG[0]);
    const filled = grid[0].length;
    if (filled >= up.length) return;      /* row complete — no blank left */
    const a = arrows[up[filled] - 1];     /* arc hopping into the current blank slot */
    if (a) a.classList.add('show', 'glow');   /* glow it so it clearly guides the next blank */
  }


  function armHint() {
    if (showHint) return;         /* already revealed for this slot */
    if (hintArmed) return;        /* already armed on this slot — don't re-pop / re-play on later wrongs */
    if (currentRow === 0) return; /* Level 1 tutorial already guides via the +2 arc —
                                     don't also show the bulb (only one thing pulses at a time) */
    hintArmed = true;
    /* the bulb is hidden until the player struggles — after 2 wrong taps it POPS IN (same
       appearance animation as before) already glowing to grab focus */
    const b = document.getElementById('hint-btn');
    if (b) {
      b.classList.remove('used', 'hb-hidden', 'hb-reveal');
      void b.offsetWidth;                        /* restart the pop-in animation */
      b.classList.add('hb-reveal', 'armed');     /* pop in + start glowing */
    }
    sfxHintGlow();                /* soft magical shimmer as the bulb pops in */
  }

  /* clear all hint state — called on new slot / level / reset */
  function resetHint() {
    hintArmed = false;
    const b = document.getElementById('hint-btn');
    /* hide the bulb again — it only reappears (pops in) once the player gets 2 wrongs */
    if (b) { b.classList.remove('armed', 'used', 'hb-reveal'); b.classList.add('hb-hidden'); }
    if (tutorialArrowsLocked) return;   /* keep the tutorial's +2 arrows shown through Level 1 */
    const w = document.getElementById('hint-arrows');
    if (w) { w.classList.add('hidden'); w.innerHTML = ''; }
  }

  /* player tapped the glowing bulb → reveal the pattern hint */
  function revealHint() {
    if (!hintArmed) return;
    hintArmed = false;
    showHint = true;
    const b = document.getElementById('hint-btn');
    if (b) { b.classList.remove('armed'); b.classList.add('used'); }
    sfxPop(720);
    buildHintArrows(ROWS_CONFIG[currentRow]);
    document.getElementById('hint-arrows').classList.remove('hidden');
    showAllArrows();
    renderQuestion();                 /* makes the correct option glow (showHint) */
    queueBotText('Follow the pattern!');
  }

  /* ── Inactivity nudge: if the player is idle ~10s during their turn, bounce the options ── */
  let _idleTimer = null;
  const IDLE_MS = 10000;

  function resetIdle() {
    if (_idleTimer) clearTimeout(_idleTimer);
    _idleTimer = setTimeout(idleNudge, IDLE_MS);
  }

  function idleNudge() {
    _idleTimer = null;
    /* only nudge when it's the player's turn and the options are tappable */
    const optArea = document.getElementById('options-area');
    const canTap = optArea && optArea.style.pointerEvents !== 'none' &&
                   !optArea.classList.contains('hidden-initially') &&
                   phase === 'question' &&
                   currentRow !== 0;   /* no nudge during the Level 1 tutorial — the +2 arc guides */
    /* don't fight the armed hint bulb — only one thing pulses at a time */
    const bulbArmed = document.getElementById('hint-btn').classList.contains('armed');
    if (canTap && !bulbArmed) {
      const rowFull = grid[currentRow].length >= getUserPositions(ROWS_CONFIG[currentRow]).length;
      if (!rowFull) {
        optArea.classList.remove('idle-nudge'); void optArea.offsetWidth;   /* restart the animation */
        optArea.classList.add('idle-nudge');
        setTimeout(() => optArea.classList.remove('idle-nudge'), 5900);   /* 4×1.4s bounce loop + stagger */
        try { sfxHover(); } catch (e) {}   /* soft blip to draw attention */
      }
    }
    resetIdle();   /* keep watching — nudge again if still idle */
  }

  /* a real tap/keypress resets the idle countdown — NOT mouse movement, since idly moving
     the cursor while thinking shouldn't count as "making progress" (that would keep the
     nudge from ever firing on desktop). resetIdle is also called from renderQuestion so the
     countdown reliably (re)starts at the top of every turn. */
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, resetIdle, { passive: true }));

  /* ── Screen switching ──────────────────────────── */
  function showScreen(name) {
    /* Inactive screens go display:none — their subtrees leave the render/compositing tree
       entirely, so their GPU textures are released. This is the windowing step, re-applied
       on every navigation. (There are no 3D-transformed faces anywhere, so backface-visibility
       ghosting cannot occur.) */
    ['intro','question','complete'].forEach(s =>
      document.getElementById('screen-' + s).classList.toggle('hidden', s !== name)
    );
    _setMenuAnims(name === 'intro');   /* pause/release the intro-button layers while occluded */
  }

  /* Top-left robot: swap between the idle static robot (#qrobot) and the dancing Byte
     (#byte-dance) — strictly one or the other, so they can never overlap/ghost. */
  function setByteDancing(on) {
    const q = document.getElementById('qrobot');
    const bd = document.getElementById('byte-dance');
    if (q)  { q.style.opacity = ''; q.classList.toggle('robot-hidden', on); }  /* class (not inline) controls it */
    if (bd) bd.classList.toggle('show', on);
  }

  /* Blast-door transition: doors slide shut, swap the screen behind them, slide open */
  function playTransition(swap) {
    stopCurrentFlow();                               /* cut the long energy-surge clip before leaving */
    const t = document.getElementById('transition');
    t.classList.remove('hidden', 'closed');
    void t.offsetWidth;
    t.classList.add('closed');                       /* doors slide shut */
    sfxPowerDown();
    setTimeout(() => { if (swap) swap(); }, 700);    /* swap the screen while covered */
    setTimeout(() => {
      t.classList.remove('closed');                  /* doors slide open on the new screen */
      sfxPowerUp();
      setTimeout(() => t.classList.add('hidden'), 700);
    }, 1050);
  }

  /* ── DOM builder ───────────────────────────────── */
  function makeSw(num, stateClass, onClick) {
    const div = document.createElement('div');
    div.className = 'sw ' + stateClass;
    if (num != null) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const span = document.createElement('span');
      span.className = 'tile-num';
      span.textContent = String(num);
      tile.appendChild(span);
      div.appendChild(tile);
    }
    if (onClick) {
      /* hover sound — throttled so rapid mouse moves don't stack */
      let hoverCooldown = false;
      div.addEventListener('mouseenter', () => {
        if (hoverCooldown) return;
        sfxHover();
        hoverCooldown = true;
        setTimeout(() => { hoverCooldown = false; }, 80);
      });
      /* click sound fires immediately; game logic fires after */
      div.addEventListener('click', () => { sfxClick(); onClick(); });
    }
    return div;
  }

  /* ── Sparks: fling glowing particles from a wrong switch ── */
  function spawnSparks(el, count) {
    if (!el) return;
    count = count || 20;

    /* central burst flash for impact */
    const burst = document.createElement('div');
    burst.className = 'spark-burst';
    el.appendChild(burst);
    burst.animate([
      { transform: 'translate(-50%,-50%) scale(0.2)', opacity: 0.95 },
      { transform: 'translate(-50%,-50%) scale(1.9)', opacity: 0 }
    ], { duration: 380, easing: 'ease-out' }).onfinish = () => burst.remove();

    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const size = 5 + Math.random() * 7;
      s.style.width = s.style.height = size + 'px';
      const hue = 18 + Math.random() * 38;            /* orange → yellow */
      s.style.background = `radial-gradient(circle, #fff 0%, hsl(${hue},100%,58%) 70%)`;
      el.appendChild(s);
      const angle = Math.random() * Math.PI * 2;
      const dist  = 55 + Math.random() * 95;
      const dx    = Math.cos(angle) * dist;
      const up    = -Math.abs(Math.sin(angle) * dist) * 0.6 - (18 + Math.random() * 42);
      const fall  = 130 + Math.random() * 120;
      const dur   = 480 + Math.random() * 360;
      s.animate([
        { transform: 'translate(-50%,-50%) translate(0px,0px) scale(1)', opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${dx}px, ${up}px) scale(1)`, opacity: 1, offset: 0.35 },
        { transform: `translate(-50%,-50%) translate(${dx * 1.25}px, ${up + fall}px) scale(0.15)`, opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(0.18,0.7,0.3,1)' }).onfinish = () => s.remove();
    }
  }

  /* ── Render question screen ────────────────────── */
  function renderQuestion() {
    const cfg = ROWS_CONFIG[currentRow];
    const row = grid[currentRow];

    /* Vent bars go green on a correct placement. Wrong answers do NOT touch the panel —
       their feedback shows only on the tapped option (shake + amber glow + sparks). */
    document.getElementById('main-panel').classList.toggle('vent-correct', justPlaced);

    /* ── Switch row container ── */
    const swRow = document.getElementById('switch-row');
    swRow.innerHTML = '';

    const userPositions = getUserPositions(cfg);
    const rowFull       = row.length >= userPositions.length;

    /* ── Power button (top-right, separate from row) ── */
    const powerEl = document.getElementById('power-btn');
    powerEl.src = assetURL(rowFull ? 'assets/Green button.webp' : 'assets/Red button.webp');
    powerEl.alt = rowFull ? 'ON' : 'OFF';
    powerEl.classList.toggle('pulsing', rowFull);   /* powers ON (green) when the row is full */
    /* current flows through the pipes the moment the pattern is completed */
    document.getElementById('screen-question').classList.toggle('current-on', rowFull);
    /* main panel border turns green on a correct, completed pattern (Figma success screen) */
    document.getElementById('panel-frame').src = assetURL(rowFull ? 'assets/figma/panel-green.svg' : 'assets/figma/panel.svg');

    /* ── 8 switch slots ── */
    const stepMs    = SWITCH_STEP_MS;
    const offsetMs  = SWITCH_OFFSET_MS;
    const prefilled = new Set(cfg.prefilled);

    for (let i = 0; i < cfg.seq.length; i++) {
      const delayMs = offsetMs + i * stepMs;
      const delay   = firstRender ? `${delayMs / 1000}s` : '0s';

      /* ── Pre-filled slot (shown from the start) ── */
      if (prefilled.has(i)) {
        const el = makeSw(cfg.seq[i], 'filled');
        const tile = el.querySelector('.tile');
        if (tile && firstRender) { tile.style.animation = 'switchDrop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both'; tile.style.animationDelay = delay; }
        swRow.appendChild(el);
        if (firstRender) setTimeout(() => sfxSwitchAppear(i), delayMs);   /* switch-appear clack */
        continue;
      }

      /* ── User-fill slot ── */
      /* a wrong pick is never placed into a slot — the slot stays empty (next-slot glow)
         and the feedback shows on the tapped option instead */
      const userIdx   = userPositions.indexOf(i);
      const answered  = userIdx < row.length;
      const isCurrent = userIdx === row.length;
      if (answered) {
        const isNew = justPlaced && userIdx === row.length - 1;
        const el = makeSw(row[userIdx], isNew ? 'new' : 'filled');
        if (isNew) el.style.animationDelay = delay;
        swRow.appendChild(el);
      } else {
        const div = document.createElement('div');
        div.className = 'sw empty' + (isCurrent ? ' next-slot' : '');
        if (firstRender) { div.style.animation = 'switchDrop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both'; div.style.animationDelay = delay; }
        swRow.appendChild(div);
      }
    }

    /* ── Options ── */
    const optArea = document.getElementById('options-area');
    optArea.innerHTML = '';
    optArea.classList.remove('reveal', 'hidden-initially');
    cfg.options.forEach(opt => {
      /* options never glow — the tutorial guides with the glowing +2 arc into the blank slot
         instead, and the bulb hint just shows the +2 arrows */
      const isWrongOption = (phase === 'wrong' || phase === 'wrong-second') && opt === wrongAnswer;
      const cls = isWrongOption ? 'wrong-option' : 'option';
      optArea.appendChild(makeSw(opt, cls, isWrongOption ? null : () => handleAnswer(opt)));
    });
    resetIdle();   /* (re)start the inactivity countdown for this turn */
  }

  /* ── Game flow ─────────────────────────────────── */

  function handleStart() {
    if (!_preloadDone) return;       /* assets not local yet — ignore early/keyboard/programmatic starts */
    if (handleStart._busy) return;   /* ignore double-taps until a game resets */
    handleStart._busy = true;
    /* unlock the Web Audio context on this user gesture so timed SFX can play later */
    try { const c = ac(); if (c.state === 'suspended') c.resume(); } catch (e) {}
    sfxClick();   /* audible PLAY press (context is now unlocked by this gesture) */
    /* little sparks burst from the PLAY button when tapped */
    spawnSparks(document.querySelector('.btn-play'), 22);
    /* short beat so the sparks are visible, THEN the blast doors close + entrance begins */
    setTimeout(() => { playTransition(() => { handleLevelStart(); }); }, 360);
  }

  function handleLevelStart() {
    phase = 'question';
    showScreen('question');

    /* playful one-by-one entrance: robot → bar → power → pipes → box → switches */
    const sq = document.getElementById('screen-question');
    sq.classList.remove('intro');
    void sq.offsetWidth;
    sq.classList.add('intro');
    setTimeout(() => sq.classList.remove('intro'), 3950);

    /* one-by-one blips: robot, then (after the box) the blue pipe + red power together */
    setTimeout(() => sfxPop(620), 150);   /* robot       */
    setTimeout(() => sfxPop(660), 2950);  /* blue pipe   */
    setTimeout(() => sfxPop(780), 2990);  /* red power   */

    /* reset the top-left character to the idle static robot */
    setByteDancing(false);
    tutorialArrowsLocked = false;   /* fresh entrance — allow the reset to clear old arrows */
    resetHint();   /* bulb dim, no hop arrows at the start of the level */
    document.getElementById('hint-btn').classList.add('hb-hidden');   /* reveal it with the bot bar */

    /* the bot bar stays hidden until everything else has appeared (start it empty so no
       stale line flashes when it reveals — the tutorial/prompt is typed in afterwards) */
    document.getElementById('bot-text').textContent = '';
    const botBar = document.getElementById('bot-bar');
    botBar.classList.remove('bar-reveal');
    botBar.classList.add('bar-hidden');

    firstRender = true; renderQuestion(); firstRender = false;

    /* robot + bar first, THEN the main box opens, THEN its blue pipe + red power button */
    const panelEl = document.getElementById('main-panel');
    panelEl.classList.remove('opening');
    void panelEl.offsetWidth;
    panelEl.classList.add('opening');
    setTimeout(sfxPanelOpen, 1000);

    /* keep the whole options box + its link pipes tucked away until every
       switch has appeared — then deploy them out of the main panel */
    const optArea = document.getElementById('options-area');
    const optBox  = document.getElementById('options-box');
    const pipes   = document.querySelectorAll('.opt-pipe');
    optBox.classList.remove('deploy', 'retract');  optBox.classList.add('hidden-initially');
    optArea.classList.remove('reveal'); optArea.classList.add('hidden-initially');
    pipes.forEach(p => { p.classList.remove('extend', 'retract'); p.classList.add('hidden-initially'); });

    const unlockDelay = SWITCH_OFFSET_MS + (TOTAL - 1) * SWITCH_STEP_MS + 700;
    setTimeout(() => {
      /* 1 — pipes shoot down out of the panel */
      pipes.forEach(p => {
        p.classList.remove('hidden-initially');
        void p.offsetWidth;
        p.classList.add('extend');
      });
      /* 2 — the (empty) option box deploys out of the panel, with the whoosh */
      setTimeout(() => {
        sfxDeploy();
        optBox.classList.remove('hidden-initially');
        void optBox.offsetWidth;
        optBox.classList.add('deploy');
      }, 560);
      /* 3 — once the box is in place, the option switches pop in one by one */
      setTimeout(() => {
        optArea.classList.remove('hidden-initially');
        void optArea.offsetWidth;
        optArea.classList.add('reveal');
        sfxPop(700);   /* single pop — all four options appear together */
        setTimeout(() => optArea.classList.remove('reveal'), 1400);
        /* Lock them NOW, not when the narration starts ~1.2s later: otherwise a fast player
           could solve the whole row in that gap and then sit through the tutorial afterwards.
           The dialogue queue unlocks them once the tutorial has finished speaking. */
        _setOptionsLock(true);

        /* 4 — finally the text box slides in, THEN the bot speaks */
        setTimeout(() => {
          botBar.classList.remove('bar-hidden');
          void botBar.offsetWidth;
          botBar.classList.add('bar-reveal');
          /* NOTE: the hint bulb stays hidden during Level 1 (the tutorial); it first appears
             on Level 2 when the real game starts (see loadLevelInPlace) */
          sfxBarOpen();
          /* ── Level 1 is the guided tutorial (this entrance only ever runs for Level 1 —
                Levels 2-4 come through loadLevelInPlace) ── */
          setTimeout(() => {
            queueBotText('Let us start fixing the switches.');
            queueBotText('These switches are in a pattern.');
            queueBotText('Let us read the pattern together.');
            /* read the prefilled numbers aloud (2, 4, 6, 8, 10), highlighting each */
            queueAction((done) => readPattern(ROWS_CONFIG[0], done));
            queueBotText('We are adding 2 at each step.');
            /* show the +2 hop arrows one by one — the 4 over the read pattern PLUS the arc
               that hops into the first blank slot (arc 4), so the blank arc reveals as part of
               the same animated sequence instead of popping in on its own at the prompt */
            queueAction((done) => {
              buildHintArrows(ROWS_CONFIG[0]);
              document.getElementById('hint-arrows').classList.remove('hidden');
              tutorialArrowsLocked = true;   /* keep the arrows up for the rest of Level 1 */
              revealArrowsSeq(0, 4, 620, done);
            });
            queueBotText('We keep adding the same number!');
            /* glow the 4 pattern arcs together (the blank arc stays static for now) */
            queueAction((done) => { glowArrows(0, 3); setTimeout(done, 900); });
            queueBotText('Tap the correct switch to continue the pattern.');
            /* the blank arc is already on screen — `showBlankArc` just moves the glow onto it
               (clearing the pattern-arc glows) so it becomes the single pulsing guide; no pop */
            queueAction((done) => { showBlankArc(); done(); });
          }, 450);
        }, 750);
      }, 560 + 1400);   /* after the box-deploy animation (1.4s) finishes */
    }, unlockDelay);
  }

  /* Levels after the tutorial: the chrome stays on screen — only the new switches
     refresh and the option placeholder animates back in (no level screen, no re-entrance). */
  function loadLevelInPlace() {
    if (timer) clearTimeout(timer);
    phase = 'question';

    /* drop the previous level's spoken line and show the fresh instruction right away,
       so when the blast doors open the bar already reads "Tap the correct switch." */
    clearVoiceQueue();
    stopConfetti();
    document.getElementById('bot-text').textContent = 'Tap the correct switch.';

    /* clear the previous level's completion state — everything else stays put */
    document.getElementById('screen-question').classList.remove('current-on', 'intro');
    document.getElementById('main-panel').classList.remove('opening');
    document.getElementById('panel-frame').src = assetURL('assets/figma/panel.svg');
    setByteDancing(false);
    tutorialArrowsLocked = false;   /* leaving the tutorial level — clear its arrows */
    resetHint();   /* clear the previous level; the bulb stays HIDDEN now and only pops in
                      (with its appearance animation) after the player gets 2 wrongs on a slot */
    document.getElementById('bot-bar').classList.remove('bar-hidden');   /* the text bar stays */

    /* the new level's switches just appear (chrome already in place — no cascade) */
    firstRender = false; renderQuestion();

    /* hide the option box + pipes, then deploy ONLY them with animation */
    const optArea = document.getElementById('options-area');
    const optBox  = document.getElementById('options-box');
    const pipes   = document.querySelectorAll('.opt-pipe');
    optBox.classList.remove('deploy', 'retract'); optBox.classList.add('hidden-initially');
    optArea.classList.remove('reveal'); optArea.classList.add('hidden-initially');
    pipes.forEach(p => { p.classList.remove('extend', 'retract'); p.classList.add('hidden-initially'); });

    setTimeout(() => {
      pipes.forEach(p => { p.classList.remove('hidden-initially'); void p.offsetWidth; p.classList.add('extend'); });
      setTimeout(() => {
        sfxDeploy();
        optBox.classList.remove('hidden-initially'); void optBox.offsetWidth; optBox.classList.add('deploy');
      }, 560);
      setTimeout(() => {
        optArea.classList.remove('hidden-initially'); void optArea.offsetWidth; optArea.classList.add('reveal');
        sfxPop(700);
        /* SPEAK: prompt now that the options are tappable (the text is already shown).
           Goes through the speech channel so an immediate tap cuts it instead of doubling up. */
        speakNow(VOICE['Tap the correct switch.']);
        setTimeout(() => optArea.classList.remove('reveal'), 1400);
      }, 560 + 1400);
    }, 1150);   /* wait for the blast doors to open before deploying the options */
  }

  function handleAnswer(val) {
    if (phase !== 'question') return;

    const cfg = ROWS_CONFIG[currentRow];
    /* Row already full → we're in the celebration window waiting on the level transition.
       Bail BEFORE clearing `timer`, otherwise a stray tap on the (invisible, retracting)
       options box would cancel the pending transition and wedge the game for good. */
    if (grid[currentRow].length >= getUserPositions(cfg).length) return;

    if (timer) clearTimeout(timer);
    const correct = getCorrect(cfg, grid[currentRow].length);

    if (val === correct) {
      sfxSwitchOn();          /* the switch flips ON for a correct pick */
      wrongCount = 0; wrongAnswer = null; showHint = false;
      resetHint();   /* clear bulb glow + hop arrows now that this slot is solved */
      grid[currentRow] = [...grid[currentRow], val];
      /* reveal the +2 arc that points into the next blank slot (guides where the answer goes) */
      if (currentRow === 0) showBlankArc();

      if (grid[currentRow].length >= getUserPositions(cfg).length) {
        _setOptionsLock(true);
        /* row-completing tap: speak the number THROUGH the queue so the win line below
           starts only after it ends (otherwise both voices played at once) */
        queueNumberVoice(val);
        sfxCorrect();
        phase = 'question';
        justPlaced = true; renderQuestion(); justPlaced = false;
        sfxRowComplete();
        setTimeout(sfxCurrentFlow, 230);   /* electric surge as the current flows (after the correct chime) */
        fireConfetti();                    /* themed energy-burst confetti to celebrate the fixed pattern */

        /* the option placeholder retracts back up into the panel */
        const _ob = document.getElementById('options-box');
        _ob.classList.remove('deploy'); void _ob.offsetWidth; _ob.classList.add('retract');
        document.querySelectorAll('.opt-pipe').forEach(p => { p.classList.remove('extend'); p.classList.add('retract'); });

        /* Byte dances in the top-left to celebrate (static robot fully hidden meanwhile) */
        setByteDancing(true);

        const isLast = currentRow + 1 >= ROWS_CONFIG.length;
        const advance = () => {
          timer = setTimeout(() => {
            if (isLast) {
              phase = 'complete';                          /* game over — stops the idle nudge */
              if (_idleTimer) { clearTimeout(_idleTimer); _idleTimer = null; }
              playTransition(() => { showScreen('complete'); playEndVideo(); });
            } else {
              /* blast-door transition, then the next level loads in place (only options animate) */
              playTransition(() => { currentRow++; loadLevelInPlace(); });
            }
          }, 700);
        };

        const winLines = [
          'Good job! You fixed these switches.',
          'Wuhoo! The switches are fixed.',
          'Well done! All the switches are fixed.'
        ];
        queueBotText(winLines[Math.floor(Math.random() * winLines.length)], null, advance);
      } else {
        playNumberVoice(val);   /* mid-row tap: nothing else is speaking, play it directly */
        sfxCorrect();
        phase = 'question';
        justPlaced = true; renderQuestion(); justPlaced = false;
      }
    } else {
      /* Wrong pick: gentle feedback ONLY on the tapped option — shake + amber glow +
         sparks + a soft sound. No spoken instruction (so it never repeats and the player
         can just try again), and nothing changes on the switch panel. */
      sfxWrong();
      wrongAnswer = val; wrongCount++;
      phase = (wrongCount >= 2) ? 'wrong-second' : 'wrong';
      renderQuestion();
      spawnSparks(document.querySelector('#options-area .sw.wrong-option .tile'));
      timer = setTimeout(() => {
        wrongAnswer = null; phase = 'question';
        if (wrongCount >= 2 && !showHint) armHint();   /* after 2 wrongs, glow the hint bulb (no spoken line) */
        renderQuestion();
      }, 900);
    }
  }

  /* ── Confetti: a themed burst of glowing energy shards, sparks & bolts ── */
  let _confettiRAF = null;
  let _confettiLast = 0;
  const CONFETTI_COLORS = ['#0ce4f9', '#7ff6ff', '#c9f9fe', '#5dff9b', '#23e070', '#ffffff'];

  function _rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* a little filled lightning bolt centred on (0,0), height ~s */
  function _bolt(ctx, s) {
    const p = [[0.18, -0.5], [-0.28, 0.08], [-0.02, 0.08], [-0.18, 0.5], [0.30, -0.10], [0.04, -0.10]];
    ctx.beginPath();
    ctx.moveTo(p[0][0] * s, p[0][1] * s);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0] * s, p[i][1] * s);
    ctx.closePath();
    ctx.fill();
  }

  function fireConfetti() {
    const canvas = document.getElementById('fx-confetti');
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext('2d');
    const W = 1920, H = 1080;
    if (canvas.width !== W) { canvas.width = W; canvas.height = H; }
    const parts = [];
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    function emit(x, y, n, angle, spread, sMin, sMax) {
      for (let i = 0; i < n; i++) {
        const ang = angle + rand(-spread / 2, spread / 2);
        const sp = rand(sMin, sMax);
        const r = Math.random();
        const shape = r < 0.18 ? 'bolt' : r < 0.40 ? 'spark' : 'shard';
        parts.push({
          x, y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          g: rand(0.30, 0.46),
          drag: rand(0.984, 0.992),
          col: pick(CONFETTI_COLORS),
          shape,
          len: shape === 'shard' ? rand(16, 32) : shape === 'bolt' ? rand(20, 34) : rand(3, 6),
          w: rand(5, 9),
          rot: rand(0, Math.PI * 2),
          vr: rand(-0.34, 0.34),
          life: 0, max: rand(95, 150),
          flutter: rand(0.03, 0.07),
          phase: rand(0, Math.PI * 2),
        });
      }
    }

    /* burst out of the power button (the energy that just switched on) … */
    emit(1786, 121, 70, Math.PI / 2, Math.PI * 1.7, 9, 22);
    /* … plus two side cannons firing up & inward for a celebratory fill */
    emit(150, 1080, 80, -Math.PI / 2 + 0.42, 0.7, 27, 41);
    emit(1770, 1080, 80, -Math.PI / 2 - 0.42, 0.7, 27, 41);
    /* a softer secondary pop from the panel a moment later */
    setTimeout(() => { if (_confettiRAF) emit(859, 360, 50, -Math.PI / 2, Math.PI * 1.2, 12, 26); }, 260);

    function draw(p, alpha) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.shadowColor = p.col;
      ctx.shadowBlur = 14;
      ctx.fillStyle = p.col;
      if (p.shape === 'shard') {
        _rrect(ctx, -p.w / 2, -p.len / 2, p.w, p.len, p.w / 2);
        ctx.fill();
      } else if (p.shape === 'spark') {
        ctx.beginPath();
        ctx.arc(0, 0, p.len, 0, Math.PI * 2);
        ctx.fill();
      } else {
        _bolt(ctx, p.len);
      }
      ctx.restore();
    }

    if (_confettiRAF) cancelAnimationFrame(_confettiRAF);
    _confettiLast = 0;
    function frame(now) {
      const dt = _confettiLast ? Math.min(2.2, (now - _confettiLast) / 16.67) : 1;
      _confettiLast = now;
      ctx.clearRect(0, 0, W, H);
      let alive = 0;
      for (const p of parts) {
        if (p.life >= p.max) continue;
        alive++;
        p.life += dt;
        p.vy += p.g * dt;
        const d = Math.pow(p.drag, dt);
        p.vx *= d; p.vy *= d;
        p.x += (p.vx + Math.sin(p.phase + p.life * p.flutter) * 1.3) * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const t = p.life / p.max;
        const alpha = t < 0.72 ? 1 : 1 - (t - 0.72) / 0.28;
        draw(p, alpha);
      }
      if (alive > 0) {
        _confettiRAF = requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, W, H);
        _confettiRAF = null;
      }
    }
    _confettiRAF = requestAnimationFrame(frame);
  }

  function stopConfetti() {
    if (_confettiRAF) { cancelAnimationFrame(_confettiRAF); _confettiRAF = null; }
    const canvas = document.getElementById('fx-confetti');
    if (canvas && canvas.getContext) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  }

  /* final screen: play the end video — the game ENDS here (no redirect back to the title) */
  function playEndVideo() {
    /* celebrate finishing the whole game: happy "ta-da!" fanfare + a confetti burst, timed
       to land as the completion screen is revealed (after the blast doors open) */
    setTimeout(() => { sfxWin(); fireConfetti(); }, 1000);
    const v = document.getElementById('end-video');
    if (!v) return;
    /* one-time fallback: if the preloaded blob fails, retry the original file so the video
       still plays. The clip just stops on its last frame when it ends — nothing to reveal. */
    let triedFile = false;
    v.onerror = () => {
      if (triedFile) return;
      triedFile = true;
      v.src = 'assets/end-video.webm';
      try { v.load(); v.currentTime = 0; } catch (e) {}
      const rp = v.play(); if (rp && rp.catch) rp.catch(() => {});
    };
    try { v.currentTime = 0; } catch (e) {}
    const p = v.play();
    if (p && p.catch) p.catch(() => {});   /* autoplay blocked — just stay on the screen */
  }


  /* ── Boot preloader ──────────────────────────────────────────────────────────────────
     Fetches every referenced asset behind the loading bar with byte-accurate streaming
     progress, smallest-first, concurrency-limited (5). Each file becomes a local blob: URL
     (assetURL) so "loaded == local"; <img>/<video>/audio (all preload="none"/no src) are fed
     their blobs so nothing double-downloads. Failure-safe: any failed / stalled / aborted
     fetch — or file:// where fetch is blocked — counts as done and the element keeps its
     original path, so the bar can never wedge below 100%. */

  /* Real on-disk sizes (bytes), generated from the actual files — weights the bar + queue. */
  const ASSET_SIZES = {
    "assets/arrow arc.webp": 770, "assets/arrow arc 2.webp": 858, "assets/arrow arc 3.webp": 928,
    "assets/hint-yellow.svg": 1238, "assets/figma/textbox.svg": 2091, "assets/Green button.webp": 5726,
    "audio/12.ogg": 6583, "assets/Red button.webp": 6820, "audio/8.ogg": 7555, "audio/11.ogg": 7996,
    "audio/10.ogg": 8080, "audio/6.ogg": 8556, "audio/electricity.ogg": 8701, "audio/2.ogg": 8793,
    "audio/13.ogg": 8990, "audio/15.ogg": 9044, "audio/30.ogg": 9173, "audio/4.ogg": 9267,
    "assets/play button.svg": 9585, "audio/18.ogg": 9854, "audio/14.ogg": 10155, "audio/21.ogg": 10282,
    "audio/16.ogg": 10430, "audio/25.ogg": 10839, "audio/24.ogg": 10912, "audio/35.ogg": 10918,
    "assets/figma/options-box.svg": 11520, "assets/figma/panel.svg": 11530,
    "assets/figma/panel-green.svg": 11531, "assets/figma/connector.webp": 14054,
    "assets/background.webp": 16230, "audio/Follow the pattern!.ogg": 17102,
    "audio/Tap the correct switch.ogg": 20734,
    "audio/Let us start fixing the switches.ogg": 26304, "audio/These switches are in a pattern.ogg": 29514,
    "audio/Let us read the pattern together.ogg": 31143, "audio/We keep adding the same number!.ogg": 31596,
    "audio/Good job! You fixed these switches.ogg": 33007, "audio/We are adding 2 at each step.ogg": 33516,
    "audio/Well done! All the switches are fixed.ogg": 34092,
    "audio/Wuhoo! The switches are fixed.ogg": 34340,
    "audio/Tap the correct switch to continue the pattern.ogg": 36606, "assets/figma/robot.webp": 43190,
    "audio/energy.ogg": 99680, "assets/figma/tile.webp": 126848, "assets/title screen.webp": 142274,
    "assets/robot dance.webp": 254398, "assets/end-video.webm": 789182,
  };
  const MANIFEST = Object.keys(ASSET_SIZES);

  /* declared elements ([data-asset]) grouped by the asset they want, so blobs swap in as they land */
  const _assetEls = {};
  document.querySelectorAll('[data-asset]').forEach(el => {
    const p = el.getAttribute('data-asset');
    (_assetEls[p] = _assetEls[p] || []).push(el);
  });
  /* one-time blob error fallback: if a blob: src ever fails to load, revert to the original
     file URL (and resume playback for videos). Attaches once per element. */
  function _blobFallback(el, orig, isVideo) {
    if (el._bfb) return; el._bfb = true;
    el.addEventListener('error', function () {
      if (String(el.src).indexOf('blob:') !== 0) return;   /* already reverted to a file URL */
      el.src = orig;
      if (isVideo) { try { el.load(); el.play(); } catch (e) {} }
    });
  }
  /* assets the stylesheet paints (not via [data-asset]) — fed to CSS through a custom property */
  const _CSS_ASSET_VARS = { 'assets/background.webp': '--bg-img', 'assets/figma/tile.webp': '--tile-img' };

  function _applyAsset(path) {
    const u = assetURL(path);
    const isBlob = u.indexOf('blob:') === 0;
    if (_CSS_ASSET_VARS[path]) {
      document.documentElement.style.setProperty(_CSS_ASSET_VARS[path], 'url("' + u + '")');
    }
    (_assetEls[path] || []).forEach(el => {
      /* video error handling lives in playEndVideo; here we guard <img> only */
      if (isBlob && el.tagName === 'IMG') _blobFallback(el, path, false);
      if (el.getAttribute('src') !== u) el.src = u;
    });
    for (const a of AUDIO_REG) if (a.url === path) {
      if (isBlob) _blobFallback(a.el, a.url, false);
      a.el.src = u;
    }
  }

  let _preloadDone = false;
  const _expected = {}, _counted = {};
  let _totalBytes = 0, _loadedBytes = 0, _lastPct = 0;
  MANIFEST.forEach(p => { _expected[p] = ASSET_SIZES[p] || 50000; _counted[p] = 0; _totalBytes += _expected[p]; });

  function _renderBar() {
    let pct = _totalBytes ? _loadedBytes / _totalBytes : 1;
    if (pct < _lastPct) pct = _lastPct; else _lastPct = pct;   /* monotonic — never goes backwards */
    pct = Math.max(0, Math.min(1, pct));
    const f = document.getElementById('boot-bar-fill'); if (f) f.style.width = (pct * 100).toFixed(1) + '%';
    const t = document.getElementById('boot-bar-text');  if (t) t.textContent = 'LOADING ' + Math.round(pct * 100) + '%';
  }
  function _bump(path, n) {
    const add = Math.max(0, Math.min(n, _expected[path] - _counted[path]));
    if (add) { _counted[path] += add; _loadedBytes += add; _renderBar(); }
  }
  function _settle(path) {   /* on finish (success OR failure) top up to full weight → bar reaches 100% */
    const room = _expected[path] - _counted[path];
    if (room > 0) { _counted[path] += room; _loadedBytes += room; _renderBar(); }
  }

  /* correct MIME for the blob — SVG especially will NOT render from a typeless blob: URL */
  const _MIME = { webp: 'image/webp', svg: 'image/svg+xml', png: 'image/png', gif: 'image/gif',
                  webm: 'video/webm', ogg: 'audio/ogg', mp3: 'audio/mpeg' };
  function _mimeOf(path, res) {
    const ct = res && res.headers.get('content-type');
    if (ct && ct.indexOf('octet-stream') < 0) return ct.split(';')[0].trim();
    return _MIME[path.split('.').pop().toLowerCase()] || 'application/octet-stream';
  }

  async function _fetchAsset(path) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 20000);   /* per-transfer abort timeout */
    try {
      const res = await fetch(path, { signal: ctrl.signal, cache: 'force-cache' });
      if (!res.ok) throw 0;
      const cl = +res.headers.get('content-length');
      if (cl && cl !== _expected[path]) { _totalBytes += cl - _expected[path]; _expected[path] = cl; }  /* refine */
      const type = _mimeOf(path, res);
      let blob;
      if (res.body && res.body.getReader) {           /* streaming reader → byte-accurate progress */
        const reader = res.body.getReader(), chunks = [];
        for (;;) { const r = await reader.read(); if (r.done) break; chunks.push(r.value); _bump(path, r.value.length); }
        blob = new Blob(chunks, { type: type });
      } else { blob = await res.blob(); _bump(path, blob.size); }
      _assetBlob[path] = URL.createObjectURL(blob);
    } catch (e) {
      _assetBlob[path] = path;   /* fetch failed / aborted / file:// — keep original path, never block */
    } finally {
      clearTimeout(to); _settle(path); _applyAsset(path);
    }
  }

  function _startPreload() {
    const queue = MANIFEST.slice().sort((a, b) => _expected[a] - _expected[b]);   /* smallest-first */
    const CONC = 5;
    const worker = async () => { while (queue.length) await _fetchAsset(queue.shift()); };
    const all = Promise.all(Array.from({ length: CONC }, worker));
    const failsafe = new Promise(res => setTimeout(res, 25000));   /* global never-hang guard */
    _renderBar();
    Promise.race([all, failsafe]).then(_revealPlay);
  }

  /* Smooth GSAP attention effects for the title-screen PLAY button */
  /* GPU/CPU windowing: the intro buttons run infinite transform+filter tweens (promoted
     compositing layers). When the intro isn't the visible screen they're occluded, so we
     pause the tweens and drop `will-change` to release that work — re-armed on return. */
  const _menuTweens = [];
  function _setMenuAnims(on) {
    for (const t of _menuTweens) { try { on ? t.play() : t.pause(); } catch (e) {} }
    document.querySelectorAll('.btn-play').forEach(b => {
      b.style.willChange = on ? 'transform, filter' : 'auto';
      const img = b.querySelector('img'); if (img) img.style.willChange = on ? 'transform, filter' : 'auto';
    });
  }
  function animatePlayButton() {
    if (!window.gsap) return;
    document.querySelectorAll('.btn-play').forEach(_setupBtnPulse);
  }
  function _setupBtnPulse(btn) {
    if (!btn || btn._gsapInit) return;
    btn._gsapInit = true;
    const img = btn.querySelector('img');
    if (!img) return;

    const DEPTH = 'drop-shadow(0 7px 14px rgba(0,16,32,0.55))';
    const PERIOD = 1.05;   /* faster, punchier pulse (breathing + glow share one rhythm) */

    /* bold breathing pulse — registered so it can be paused while the intro is occluded */
    _menuTweens.push(gsap.to(img, {
      scale: 1.11, duration: PERIOD, repeat: -1, yoyo: true,
      ease: 'sine.inOut', transformOrigin: '50% 50%'
    }));

    /* shaped neon glow that hugs the octagon (drop-shadow on the SVG), pulsing in sync */
    const g = { blur: 16, a: 0.55 };
    const paint = () => {
      img.style.filter = 'drop-shadow(0 0 ' + g.blur.toFixed(1) + 'px rgba(12,228,249,' +
                         g.a.toFixed(3) + ')) ' + DEPTH;
    };
    paint();
    _menuTweens.push(gsap.to(g, {
      blur: 46, a: 1.0, duration: PERIOD, repeat: -1, yoyo: true,
      ease: 'sine.inOut', onUpdate: paint
    }));

    /* smooth hover / press — all eased through GSAP */
    const to = (s, d, ease) => gsap.to(btn, { scale: s, duration: d, ease: ease, overwrite: 'auto' });
    btn.addEventListener('mouseenter',  () => to(1.07, 0.35, 'power3.out'));
    btn.addEventListener('mouseleave',  () => to(1.00, 0.55, 'power3.out'));
    btn.addEventListener('mousedown',   () => to(0.94, 0.12, 'power2.out'));
    btn.addEventListener('mouseup',     () => to(1.07, 0.30, 'power2.out'));
    btn.addEventListener('touchstart',  () => to(0.94, 0.12, 'power2.out'), { passive: true });
    btn.addEventListener('touchend',    () => to(1.00, 0.40, 'power2.out'));
  }

  /* wire hover + press sounds onto the menu buttons (the switch/option tiles already have them) */
  function wireMenuSfx() {
    const addHover = (el) => {
      if (!el || el._hoverSfx) return;
      el._hoverSfx = true;
      let cd = false;
      el.addEventListener('mouseenter', () => {
        if (cd) return; sfxHover(); cd = true; setTimeout(() => { cd = false; }, 80);
      });
    };
    const play  = document.querySelector('.btn-play');
    const hint  = document.getElementById('hint-btn');
    addHover(play);    /* PLAY: the press sound is played in handleStart() */
    if (hint && !hint._wired) {
      hint._wired = true;
      addHover(hint);
      hint.addEventListener('click', () => { sfxClick(); revealHint(); });
    }
  }

  /* reveal the PLAY button (pop-in) once every asset is local (or the failsafe fired) */
  function _revealPlay() {
    if (_booted) return;
    _booted = true;
    _preloadDone = true;
    _loadedBytes = _totalBytes; _renderBar();       /* force the bar to a clean 100% */
    const wrap = document.getElementById('boot-bar-wrap');
    if (wrap) wrap.classList.add('boot-gone');
    const play = document.querySelector('.btn-play');
    if (play) {
      play.classList.remove('boot-hidden');
      void play.offsetWidth;
      play.classList.add('btn-pop');
      setTimeout(() => play.classList.remove('btn-pop'), 700);   /* free the transform for GSAP hover */
    }
    animatePlayButton();
  }

  /* boot: game state + intro are live immediately; assets stream in behind the loading bar,
     and PLAY only appears (guarded) once they're local */
  let _booted = false;
  initGrid();
  showScreen('intro');
  wireMenuSfx();
  _startPreload();
</script>
</body>
</html>
